name: CI

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  android:
    name: Android APK + unit tests
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
      ANDROID_HOME: ${{ github.workspace }}/android-sdk
      GRADLE_USER_HOME: ${{ github.workspace }}/.gradle
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Install Android SDK
        shell: bash
        run: |
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          cd /tmp
          curl -fsSLo tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q tools.zip -d "$ANDROID_SDK_ROOT/cmdline-tools"
          mv "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          set +o pipefail
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_SDK_ROOT" --licenses >/dev/null
          set -o pipefail
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_SDK_ROOT" "platform-tools" "platforms;android-34" "build-tools;34.0.0"
      - name: Install Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Build app-managed runtime engine
        run: |
          git clone --depth 1 https://github.com/oonid/pr.git /tmp/pr
          # Preserve the actual terminating signal in PtyNative.waitPid().
          # Upstream collapses every WIFSIGNALED status to -2; encode it as
          # -(128 + signal), e.g. SIGINT=-130, SIGKILL=-137, SIGTERM=-143.
          python3 - <<'PY'
          from pathlib import Path
          p = Path("/tmp/pr/android/proot-engine/src/main/cpp/ptyjni.c")
          s = p.read_text()
          old = "    if (WIFEXITED(status)) return WEXITSTATUS(status);\n    return -2;"
          new = "    if (WIFEXITED(status)) return WEXITSTATUS(status);\n    if (WIFSIGNALED(status)) return -(128 + WTERMSIG(status));\n    return -2;"
          if old not in s:
              raise SystemExit("Unexpected ptyjni.c: waitPid patch anchor not found")
          p.write_text(s.replace(old, new, 1))
          PY
          cd /tmp/pr/android
          chmod +x gradlew
          ./gradlew :proot-engine:assembleDebug
          mkdir -p "$GITHUB_WORKSPACE/app/libs"
          cp proot-engine/build/outputs/aar/proot-engine-debug.aar "$GITHUB_WORKSPACE/app/libs/"
      - name: Unit tests
        run: gradle testDebugUnitTest
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Re-sign with reproducible public Android test key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/aosp-testkey" "$GITHUB_WORKSPACE/app/build/outputs/apk/public-debug"
          curl -fsSL https://raw.githubusercontent.com/aosp-mirror/platform_build/master/target/product/security/testkey.pk8 -o "$RUNNER_TEMP/aosp-testkey/testkey.pk8"
          curl -fsSL https://raw.githubusercontent.com/aosp-mirror/platform_build/master/target/product/security/testkey.x509.pem -o "$RUNNER_TEMP/aosp-testkey/testkey.x509.pem"
          APK="$(find app/build/outputs/apk/debug -name '*.apk' -print -quit)"
          "$ANDROID_SDK_ROOT/build-tools/34.0.0/apksigner" sign \
            --key "$RUNNER_TEMP/aosp-testkey/testkey.pk8" \
            --cert "$RUNNER_TEMP/aosp-testkey/testkey.x509.pem" \
            --out app/build/outputs/apk/public-debug/esp32-flashing-app.apk \
            "$APK"
          "$ANDROID_SDK_ROOT/build-tools/34.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/public-debug/esp32-flashing-app.apk
          "$ANDROID_SDK_ROOT/build-tools/34.0.0/aapt" dump badging app/build/outputs/apk/public-debug/esp32-flashing-app.apk | grep "package: name='com.engperini.esp32flashingapp'"
      - uses: actions/upload-artifact@v4
        with:
          name: esp32-flashing-app-public-debug-apk
          path: app/build/outputs/apk/public-debug/esp32-flashing-app.apk
          if-no-files-found: error

  esp-idf:
    name: ESP-IDF 5.5 reference firmware
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.5
    steps:
      - uses: actions/checkout@v4
      - name: Build esp32s3 firmware
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          cd test-firmware
          idf.py set-target esp32s3
          idf.py build
          test -f build/bootloader/bootloader.bin
          test -f build/partition_table/partition-table.bin
          test -f build/esp32-flashing-test.bin
          test -f build/flash_args
          cat build/flash_args
      - name: Validate ESP-IDF Component Manager dependency resolution
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          rm -rf /tmp/component-manager-proof
          mkdir -p /tmp/component-manager-proof/main
          cat > /tmp/component-manager-proof/CMakeLists.txt <<'EOF'
          cmake_minimum_required(VERSION 3.16)
          include($ENV{IDF_PATH}/tools/cmake/project.cmake)
          project(component_manager_proof)
          EOF
          cat > /tmp/component-manager-proof/main/CMakeLists.txt <<'EOF'
          idf_component_register(SRCS "main.c" INCLUDE_DIRS ".")
          EOF
          cat > /tmp/component-manager-proof/main/idf_component.yml <<'EOF'
          dependencies:
            espressif/esp-lib-utils: "^0.3.0"
          EOF
          cat > /tmp/component-manager-proof/main/main.c <<'EOF'
          #include "freertos/FreeRTOS.h"
          #include "freertos/task.h"
          void app_main(void) { while (1) vTaskDelay(pdMS_TO_TICKS(1000)); }
          EOF
          cd /tmp/component-manager-proof
          idf.py set-target esp32
          idf.py build
          test -f dependencies.lock
          test -d managed_components/espressif__esp-lib-utils
          grep -q "espressif/esp-lib-utils" dependencies.lock

      - uses: actions/upload-artifact@v4
        with:
          name: esp-idf-5.5-reference-build
          path: |
            test-firmware/build/bootloader/bootloader.bin
            test-firmware/build/partition_table/partition-table.bin
            test-firmware/build/esp32-flashing-test.bin
            test-firmware/build/flash_args
          if-no-files-found: error

  runtime-engine:
    name: App-managed Linux runtime engine proof
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Fetch maintained Android proot-engine
        run: git clone --depth 1 https://github.com/oonid/pr.git /tmp/pr
      - name: Build proot-engine AAR
        working-directory: /tmp/pr/android
        run: |
          chmod +x gradlew
          ./gradlew :proot-engine:assembleDebug
          test -f proot-engine/build/outputs/aar/proot-engine-debug.aar
      - name: Verify arm64 runtime payload
        run: |
          unzip -l /tmp/pr/android/proot-engine/build/outputs/aar/proot-engine-debug.aar | tee /tmp/aar.txt
          grep -q "jni/arm64-v8a/libproot.so" /tmp/aar.txt
          grep -q "jni/arm64-v8a/libproot-loader.so" /tmp/aar.txt
          grep -q "jni/arm64-v8a/libpr-cli.so" /tmp/aar.txt
          grep -q "jni/arm64-v8a/libbusybox.so" /tmp/aar.txt
      - uses: actions/upload-artifact@v4
        with:
          name: proot-engine-arm64-proof
          path: /tmp/pr/android/proot-engine/build/outputs/aar/proot-engine-debug.aar
          if-no-files-found: error
