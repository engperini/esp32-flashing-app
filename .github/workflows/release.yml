name: Publish Release APK

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        required: true
        default: v0.2.0
      run_id:
        description: Successful CI run ID containing the already validated APK
        required: true
        default: "37573184158"

permissions:
  contents: write
  actions: read

jobs:
  release:
    name: Publish existing validated APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download APK from validated CI run
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          set -euo pipefail
          mkdir -p release-apk
          gh run download "$RUN_ID" --repo "${{ github.repository }}" --name esp32-flashing-app-public-debug-apk --dir release-apk
          test -f release-apk/esp32-flashing-app.apk
          sha256sum release-apk/esp32-flashing-app.apk
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          gh release create "$TAG" release-apk/esp32-flashing-app.apk             --repo "${{ github.repository }}"             --target main             --title "ESP32 Flashing App $TAG"             --notes "Stable physically validated Android release for ESP32-S3 and classic ESP32. Includes app-managed ESP-IDF 5.5, native Android USB flashing with MD5 verification, automatic target-specific post-flash reset, responsive flash progress, USB reconnection, and Serial Monitor. The published APK is the exact artifact from validated CI run #249 (37573184158)."
