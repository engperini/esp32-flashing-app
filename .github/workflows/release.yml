name: Publish Release APK

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        required: true
        default: v0.1.0
      run_id:
        description: Successful CI run ID containing the already validated APK
        required: true
        default: "37267663382"

permissions:
  contents: write
  actions: read

jobs:
  release:
    name: Publish existing validated APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download APK from validated CI run
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          set -euo pipefail
          mkdir -p release-apk
          gh run download "$RUN_ID" --repo "${{ github.repository }}" --name esp32-flashing-app-public-debug-apk --dir release-apk
          test -f release-apk/esp32-flashing-app.apk
          sha256sum release-apk/esp32-flashing-app.apk
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          gh release create "$TAG" release-apk/esp32-flashing-app.apk             --repo "${{ github.repository }}"             --target 7b88dba21ed8e6285d3677538f1266682885ea92             --title "ESP32 Flashing App $TAG"             --notes "Physically validated Android/ESP32-S3 release. Includes app-managed ESP-IDF 5.5 build environment, native Android USB flash with MD5 verification, automatic exit from ESP32-S3 download mode, USB auto-reconnect, and serial monitor."
